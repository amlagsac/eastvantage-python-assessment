[project]
name = "eastvantage-python-exam"
version = "1.0.0"
description = "Minimal FastAPI address book with SQLite database"
readme = "README.md"
authors = [
    { name = "amlagsac", email = "andremlagsac@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
